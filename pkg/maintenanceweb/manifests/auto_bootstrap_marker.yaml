# This manifest is intentionally inert. Its only purpose is to exist under the
# name "nirvati-auto-bootstrap" in the applied machine config, so that
# AutoBootstrapController (internal/app/machined/pkg/controllers/runtime/auto_bootstrap.go)
# can recognize that a config was generated by the Nirvati Init UI's "set up a
# new server" wizard, and is therefore safe to automatically bootstrap etcd
# for once the node comes up. Do not remove or rename without updating that
# controller's marker-name check.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nirvati-auto-bootstrap-marker
  namespace: kube-system
